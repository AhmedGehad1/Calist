name: release

# Push a version tag and this builds the Windows executable and publishes it
# as a GitHub Release, giving a permanent download link:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# It can also be run by hand from the Actions tab (workflow_dispatch), which
# produces a build artifact without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # needed to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests before shipping anything
        run: |
          pip install pytest
          python -m pytest -q

      - name: Build Calist.exe
        run: pyinstaller calist.spec --noconfirm --clean

      - name: Check the build looks sane
        shell: pwsh
        run: |
          $exe = "dist/Calist.exe"
          if (-not (Test-Path $exe)) { throw "Calist.exe was not produced" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Output "Calist.exe is $mb MB"
          # A build missing its bundled data lands well under this.
          if ($mb -lt 8) { throw "Calist.exe is only $mb MB - data files are probably missing" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calist-windows
          path: dist/Calist.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Calist.exe
          draft: false
          generate_release_notes: true
          body: |
            ## Download

            **[Calist.exe](https://github.com/AhmedGehad1/Calist/releases/latest/download/Calist.exe)**
            — one file, no installer, no Python needed. Windows 10 or 11.

            Download it, double-click, point it at your folder of inspection forms.
            The register template is built in, so there is nothing to set up first.

            > Windows may show a "Windows protected your PC" screen the first time,
            > because the file is not code-signed. Click **More info → Run anyway**.
